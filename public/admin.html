<style>
/* Add to your existing admin CSS */
.cotw-section { margin: 24px 0; }
.cotw-section .section-title {
  font-size: .8rem; text-transform: uppercase; letter-spacing: .5px;
  color: var(--text3, #aaa); margin-bottom: 14px;
  display: flex; align-items: center; gap: 8px;
}
.cotw-current {
  background: rgba(240,179,91,.08); border: 1px solid rgba(240,179,91,.25);
  border-radius: 12px; padding: 14px 16px; margin-bottom: 14px;
}
.cotw-current-label {
  font-size: .7rem; color: #f0b35b; margin-bottom: 6px; font-weight: 600;
}
.cotw-current-text {
  font-size: .85rem; line-height: 1.55; color: var(--text, #eee);
  margin-bottom: 10px; max-height: 80px; overflow: hidden;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
}
.cotw-clear-btn {
  padding: 6px 14px; border-radius: 20px; font-size: .75rem;
  border: 1px solid rgba(232,96,122,.3); color: #e8607a;
  background: rgba(232,96,122,.1); cursor: pointer; transition: all .2s;
}
.cotw-clear-btn:hover { background: rgba(232,96,122,.2); }
.cotw-no-pin {
  font-size: .82rem; color: var(--text3, #888); font-style: italic; margin-bottom: 12px;
}
.cotw-search-row {
  display: flex; gap: 8px; margin-bottom: 10px;
}
.cotw-search-input {
  flex: 1; padding: 9px 12px; border-radius: 8px;
  background: var(--surf2, #1a1528); border: 1px solid var(--border, rgba(255,255,255,.08));
  color: var(--text, #eee); font-size: .83rem; outline: none; font-family: inherit;
}
.cotw-search-input:focus { border-color: rgba(240,179,91,.4); }
.cotw-search-btn {
  padding: 9px 16px; border-radius: 8px;
  background: rgba(240,179,91,.15); border: 1px solid rgba(240,179,91,.3);
  color: #f0b35b; font-size: .82rem; cursor: pointer; font-family: inherit;
  transition: all .2s;
}
.cotw-search-btn:hover { background: rgba(240,179,91,.25); }
.cotw-results { display: flex; flex-direction: column; gap: 8px; max-height: 340px; overflow-y: auto; }
.cotw-result-item {
  background: var(--surf2, #1a1528); border: 1px solid var(--border, rgba(255,255,255,.08));
  border-radius: 10px; padding: 12px 14px;
  display: flex; align-items: flex-start; gap: 10px;
}
.cotw-result-text { flex: 1; font-size: .82rem; line-height: 1.5; color: var(--text2, #ccc);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cotw-result-meta { font-size: .68rem; color: var(--text3, #888); margin-top: 4px; }
.cotw-pin-btn {
  padding: 6px 14px; border-radius: 8px; flex-shrink: 0;
  background: rgba(240,179,91,.15); border: 1px solid rgba(240,179,91,.3);
  color: #f0b35b; font-size: .75rem; cursor: pointer; font-family: inherit;
  transition: all .2s; align-self: center;
}
.cotw-pin-btn:hover { background: rgba(240,179,91,.3); }
.cotw-pin-btn.pinned { background: rgba(240,179,91,.25); border-color: #f0b35b; }
.cotw-no-results { font-size: .8rem; color: var(--text3, #888); padding: 10px 0; text-align: center; }
</style>

<!-- Paste this HTML where you want the COTW section in admin.html -->
<div class="cotw-section">
  <div class="section-title">⭐ Confession of the Week (COTW)</div>

  <!-- Current COTW display -->
  <div id="cotwCurrent">
    <div class="cotw-no-pin">Auto-selecting (most liked this week)</div>
  </div>

  <!-- Search & pin -->
  <div class="cotw-search-row">
    <input class="cotw-search-input" id="cotwSearchInput" placeholder="Search confession text to pin..."/>
    <button class="cotw-search-btn" onclick="cotwSearch()">Search</button>
  </div>
  <div class="cotw-results" id="cotwResults"></div>
</div>

<script>
// ── COTW Admin JS — add to your existing admin JS block ──

const COTW_API = 'https://confession-app-6sr0.onrender.com'; // same as your API base

// Load current COTW on admin panel open
async function loadCotwStatus() {
  const token = getAdminToken(); // use your existing auth token getter
  try {
    const r = await fetch(`${COTW_API}/api/admin/cotw`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    const d = await r.json();
    const el = document.getElementById('cotwCurrent');
    if (d.pinned && d.confession) {
      el.innerHTML = `
        <div class="cotw-current">
          <div class="cotw-current-label">⭐ Currently Pinned as COTW</div>
          <div class="cotw-current-text">${escHtml(d.confession.message)}</div>
          <div style="font-size:.7rem;color:var(--text3,#888);margin-bottom:8px">
            ${d.confession.category} · ${d.confession.likes||0} ❤️ · ID: ${d.confession.id.slice(0,8)}...
          </div>
          <button class="cotw-clear-btn" onclick="cotwClear()">✕ Clear Pin (revert to auto)</button>
        </div>`;
    } else {
      el.innerHTML = '<div class="cotw-no-pin">Auto-selecting (most liked this week) — search and pin one below</div>';
    }
  } catch(e) { console.error('COTW load error', e); }
}

// Search confessions to pin
async function cotwSearch() {
  const query = document.getElementById('cotwSearchInput').value.trim().toLowerCase();
  const resultsEl = document.getElementById('cotwResults');
  resultsEl.innerHTML = '<div class="cotw-no-results">Searching...</div>';
  try {
    const token = getAdminToken();
    // Fetch all approved confessions and filter client-side
    const r = await fetch(`${COTW_API}/api/confessions`);
    const all = await r.json();
    const filtered = query
      ? all.filter(c => (c.message||'').toLowerCase().includes(query))
      : all.sort((a,b) => (b.likes||0)-(a.likes||0)).slice(0, 20); // top 20 if no query

    if (!filtered.length) {
      resultsEl.innerHTML = '<div class="cotw-no-results">No confessions found</div>';
      return;
    }
    resultsEl.innerHTML = filtered.slice(0,20).map(c => `
      <div class="cotw-result-item">
        <div style="flex:1">
          <div class="cotw-result-text">${escHtml(c.message||c.pollOptions?.o1||'')}</div>
          <div class="cotw-result-meta">${c.category} · ${c.likes||0} ❤️ · ${timeAgo(c.createdAt)}</div>
        </div>
        <button class="cotw-pin-btn" onclick="cotwPin('${c.id}',this)">📌 Pin</button>
      </div>`).join('');
  } catch(e) {
    resultsEl.innerHTML = '<div class="cotw-no-results">Failed to load confessions</div>';
  }
}

// Pin a confession as COTW
async function cotwPin(confessionId, btn) {
  const token = getAdminToken();
  btn.textContent = 'Pinning...'; btn.disabled = true;
  try {
    const r = await fetch(`${COTW_API}/api/admin/cotw/set`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
      body: JSON.stringify({ confessionId })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    btn.textContent = '✓ Pinned'; btn.classList.add('pinned');
    showAdminToast('⭐ Confession pinned as COTW!');
    await loadCotwStatus();
  } catch(e) {
    btn.textContent = '📌 Pin'; btn.disabled = false;
    showAdminToast('❌ ' + e.message);
  }
}

// Clear the manual COTW pin
async function cotwClear() {
  const token = getAdminToken();
  try {
    await fetch(`${COTW_API}/api/admin/cotw/clear`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }
    });
    showAdminToast('✓ COTW pin cleared — reverted to auto');
    await loadCotwStatus();
  } catch(e) { showAdminToast('❌ Failed to clear'); }
}

// Helper — reuse from existing admin code or define:
function escHtml(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }
function timeAgo(ts) {
  const d=Date.now()-ts, h=3600000, day=86400000;
  if(d<h) return Math.floor(d/60000)+'m ago';
  if(d<day) return Math.floor(d/h)+'h ago';
  return Math.floor(d/day)+'d ago';
}
// NOTE: getAdminToken() — use your existing token method
// NOTE: showAdminToast() — use your existing toast method

</script>
